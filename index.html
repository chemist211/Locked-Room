<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#150b30">
<meta name="description" content="Coin Rush - run, dodge, collect coins and unlock new runners.">
<title>Coin Rush</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<style>
:root{--gold:#ffd34d;--pink:#ff4f9a;--cy:#38e1ff;--panel:#241347;--panel2:#2f1a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#150b30;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--cy);outline-offset:2px}

#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none}
#hud .pill{background:rgba(20,8,48,.62);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:8px 16px;font-weight:800;font-size:20px;letter-spacing:.5px;backdrop-filter:blur(6px)}
#hud .coin{color:var(--gold);margin-inline-start:auto}
#btnPause{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:rgba(20,8,48,.62);border:1px solid rgba(255,255,255,.15);font-size:14px;font-weight:900}
#powers{position:fixed;top:calc(64px + env(safe-area-inset-top));left:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#powers div{background:rgba(20,8,48,.62);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.15)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(21,11,48,.25),rgba(21,11,48,.82))}
.logo{font-size:clamp(44px,12vw,84px);font-weight:900;line-height:.95;letter-spacing:2px;margin:0;background:linear-gradient(180deg,#fff2a8,var(--gold) 45%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a2e00) drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.sub{margin:0 0 6px;opacity:.85;font-weight:600}
.btn{border-radius:18px;padding:14px 26px;font-weight:800;font-size:18px;background:linear-gradient(180deg,#5b8cff,#3556d8);box-shadow:0 5px 0 #1d2f86,0 12px 24px rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d2f86}
.btn.play{font-size:26px;padding:16px 56px;background:linear-gradient(180deg,#ffe066,#ffae1a);color:#4a2400;box-shadow:0 6px 0 #b36a00,0 14px 28px rgba(0,0,0,.4)}
.btn.play:active{box-shadow:0 2px 0 #b36a00}
.btn.alt{background:linear-gradient(180deg,#8b5cf6,#6130d6);box-shadow:0 5px 0 #371a85,0 12px 24px rgba(0,0,0,.35)}
.btn.green{background:linear-gradient(180deg,#3ddc97,#16a46c);box-shadow:0 5px 0 #0b6b45,0 12px 24px rgba(0,0,0,.35)}
.btn.red{background:linear-gradient(180deg,#ff6b7d,#d12a45);box-shadow:0 5px 0 #7d1226}
.btn:disabled{opacity:.5;filter:grayscale(.5);cursor:not-allowed}
.btn.sm{padding:9px 16px;font-size:15px;border-radius:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.wallet{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:rgba(20,8,48,.62);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:8px 16px;font-weight:800;color:var(--gold);font-size:18px}
.best{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;background:rgba(20,8,48,.62);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff4f6a;margin-inline-start:8px;box-shadow:0 0 8px #ff4f6a;vertical-align:middle}
.stat{font-size:clamp(46px,14vw,80px);font-weight:900;line-height:1}
.statl{opacity:.8;font-weight:700;letter-spacing:2px;font-size:13px;text-transform:uppercase}
.new{color:var(--gold);font-weight:900;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.hint{opacity:.7;font-size:13px;margin-top:6px}

.modal{position:fixed;inset:0;background:rgba(10,4,26,.78);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;touch-action:pan-y;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:24px;flex:1;text-align:start}
.x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);font-weight:900}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:14px;background:rgba(255,255,255,.08);font-weight:800;font-size:15px}
.tab.on{background:linear-gradient(180deg,#8b5cf6,#6130d6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,211,77,.35)}
.card b{font-size:16px}
.avatar{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.urow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:18px;padding:12px;margin-bottom:10px;text-align:start}
.urow .info{flex:1;min-width:0}
.urow small{opacity:.75;display:block}
.bar{display:flex;gap:4px;margin-top:6px}
.bar i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.15)}
.bar i.on{background:linear-gradient(90deg,var(--gold),#ff9a3d)}
.field{display:flex;gap:8px;margin-top:8px}
.field input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.28);color:#fff;font-size:16px;letter-spacing:1px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);text-align:start}
.msg{min-height:20px;font-size:14px;margin-top:8px;font-weight:700;text-align:start}
.msg.ok{color:#5df2a8}.msg.err{color:#ff8b9b}

#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:50;pointer-events:none;width:calc(100% - 28px);max-width:420px}
#toast div{background:rgba(10,4,26,.92);border:1px solid rgba(255,255,255,.18);padding:10px 18px;border-radius:14px;font-weight:700;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

#vault{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0f172a;z-index:9999}
#exitZone{position:fixed;top:0;left:50%;transform:translateX(-50%);width:96px;height:16px;z-index:10000;background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<noscript>Coin Rush needs JavaScript enabled.</noscript>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="pill" id="hScore">0</div>
  <div class="pill coin" id="hCoins">🪙 0</div>
  <button id="btnPause" aria-label="Pause">❚❚</button>
</div>
<div id="powers" class="hidden"></div>

<div id="menu" class="screen">
  <div class="best" id="mBest">Best 0</div>
  <div class="wallet" id="mCoins">🪙 0</div>
  <h1 class="logo">COIN<br>RUSH</h1>
  <p class="sub">Dodge. Collect. Unlock.</p>
  <button class="btn play" id="bPlay">PLAY</button>
  <div class="row">
    <button class="btn alt" id="bShop">🛒 Shop</button>
    <button class="btn green" id="bChest">🎁 Daily chest<span class="dot hidden" id="chestDot"></span></button>
    <button class="btn" id="bSet">⚙️ Settings</button>
  </div>
  <div class="hint">Swipe or use arrow keys / WASD · Space to jump · ↓ to slide</div>
</div>

<div id="over" class="screen hidden">
  <div class="statl">Score</div>
  <div class="stat" id="oScore">0</div>
  <div id="oNew" class="new hidden">NEW BEST!</div>
  <div class="statl" id="oBest">Best 0</div>
  <div class="stat" style="font-size:34px;color:var(--gold)" id="oCoins">+0 🪙</div>
  <div class="row" style="margin-top:8px">
    <button class="btn play" id="bAgain" style="font-size:22px;padding:14px 36px">AGAIN</button>
    <button class="btn" id="bHome">Menu</button>
  </div>
</div>

<div id="pauseS" class="screen hidden">
  <h2 class="logo" style="font-size:48px">PAUSED</h2>
  <div class="row">
    <button class="btn play" id="bResume" style="font-size:22px;padding:14px 36px">RESUME</button>
    <button class="btn red" id="bQuit">Quit</button>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head"><h2 id="mTitle"></h2><button class="x" id="mClose" aria-label="Close">✕</button></div>
    <div id="mBody"></div>
  </div>
</div>

<div id="toast" aria-live="polite"></div>
<div id="exitZone" class="hidden"></div>

/* ---------- canvas / projection ---------- */
var cv=$('cv'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,L=100,horizon=0,baseY=0,pb=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);L=Math.min(W/3.3,H*0.26);horizon=H*0.30;baseY=H*0.84;pb=(H-horizon)/(baseY-horizon);genCity()}
function P(z){return 1/(1+z*0.055)}
function X(lane,p){return W/2+lane*L*p}
function Y(p){return horizon+(baseY-horizon)*p}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
var city=[];
function genCity(){city=[];var x=-20,seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}while(x<W+40){var w=18+rnd()*40,h=14+rnd()*(H*0.14);city.push({x:x,w:w,h:h,l:rnd()>.5});x+=w+2+rnd()*6}}

function coinLine(lane,z,n){for(var i=0;i<n;i++)g.objs.push({t:'coin',lane:lane,z:z+i*2.6,h:0.3})}
function coinArc(lane,z){for(var i=0;i<5;i++)g.objs.push({t:'coin',lane:lane,z:z-4.4+i*2.2,h:0.25+0.85*Math.sin(Math.PI*i/4)})}

function b64bytes(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function decryptVault(code){
 var raw=b64bytes(CHAT_B64),salt=raw.slice(0,16),iv=raw.slice(16,28),data=raw.slice(28);
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
}

function closeVault(){
 var f=$('vault');if(f)f.remove();if(vaultURL){URL.revokeObjectURL(vaultURL);vaultURL=null}
 chatOpen=false;$('exitZone').classList.add('hidden');last=performance.now();toMenu();
}
async function redeem(){
 var inp=$('code'),msg=$('cMsg'),btn=$('bRedeem');if(!inp)return;
 var code=inp.value.trim().toUpperCase();
 function say(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err')}
 if(!code){say('Enter a code',false);return}
 if(PROMOS[code]!==undefined){
  if(S.codes.indexOf(code)>=0){say('Code already used',false);return}
  S.codes.push(code);S.coins+=PROMOS[code];save();sfx.buy();say('+'+PROMOS[code]+' coins added!',true);return;
 }
 btn.disabled=true;say('Checking…',true);
 try{
  if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
  var buf=await decryptVault(code);inp.value='';openVault(buf);
 }catch(e){btn.disabled=false;say('Invalid or expired code',false);sfx.no()}
}

/* ---------- events ---------- */
$('bPlay').onclick=startGame;$('bAgain').onclick=startGame;$('bHome').onclick=toMenu;$('bQuit').onclick=toMenu;$('bResume').onclick=resume;$('btnPause').onclick=pause;
$('bShop').onclick=function(){openModal('shop')};$('bSet').onclick=function(){openModal('settings')};$('mClose').onclick=closeModal;
$('modal').addEventListener('mousedown',function(e){if(e.target===$('modal'))closeModal()});
$('bChest').onclick=function(){
 if(chestReady()){var r=50+Math.floor(Math.random()*101);S.coins+=r;S.chest=Date.now();save();sfx.buy();toast('🎁 You got '+r+' coins!');refreshMenu()}
 else{var ms=20*3600*1000-(Date.now()-S.chest),hh=Math.floor(ms/3600000),mm=Math.ceil((ms%3600000)/60000);toast('Come back in '+hh+'h '+mm+'m')}
};
$('mBody').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){shopTab=b.dataset.tab;renderShop()}
 else if(b.dataset.equip!==undefined){S.skin=+b.dataset.equip;save();renderShop()}
 else if(b.dataset.buyskin!==undefined)buySkin(+b.dataset.buyskin);
 else if(b.dataset.buyup)buyUp(b.dataset.buyup);
 else if(b.dataset.pack!==undefined){var p=PACKS[+b.dataset.pack];S.coins+=p.c;save();sfx.buy();toast('Demo purchase: +'+fmt(p.c)+' coins');renderShop()}
 else if(b.id==='tSound'){S.sound=!S.sound;save();renderSettings()}
 else if(b.id==='bRedeem')redeem();
 else if(b.id==='bReset'){if(b.dataset.sure){try{localStorage.removeItem(KEY)}catch(x){}location.reload()}else{b.dataset.sure='1';b.textContent='Tap again';}}
});
$('mBody').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='code'){e.preventDefault();redeem()}});

window.addEventListener('keydown',function(e){
 if(chatOpen||modalKind)return;
 var k=e.key;
 if(state==='play'){
  var m={ArrowLeft:'L',a:'L',A:'L',ArrowRight:'R',d:'R',D:'R',ArrowUp:'U',w:'U',W:'U',' ':'U',ArrowDown:'D',s:'D',S:'D'}[k];
  if(m){e.preventDefault();act(m)}else if(k==='p'||k==='P'||k==='Escape')pause();
 }else if(state==='pause'&&(k==='p'||k==='P'||k==='Escape'))resume();
 else if((state==='menu'||state==='over')&&(k==='Enter'))startGame();
});
var ts0=null;
window.addEventListener('touchstart',function(e){if(state!=='play')return;var t=e.touches[0];ts0={x:t.clientX,y:t.clientY}},{passive:true});
window.addEventListener('touchmove',function(e){
 if(state!=='play'||!ts0)return;var t=e.touches[0],dx=t.clientX-ts0.x,dy=t.clientY-ts0.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))>26){act(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy<0?'U':'D'));ts0={x:t.clientX,y:t.clientY}}
},{passive:true});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause()});
window.addEventListener('resize',resize);
/* hidden way back: double-tap the invisible strip at the top-centre */
var lastTap=0;
$('exitZone').addEventListener('pointerup',function(){var n=Date.now();if(n-lastTap<450){lastTap=0;closeVault()}else lastTap=n});

resize();refreshMenu();show('menu');requestAnimationFrame(frame);
})();
</script>
</body>
</html>
